# Site-wide settings for Jekyll (GitHub Pages builds the site from this).
# Everyday text lives in _data/ and in the _authors/ and _press/ folders, not here.

title: Public Records Enforcement Project
description: The Public Records Enforcement Project requests and sues for California police use-of-force records and publishes what it obtains.

# The site's address (custom domain, connected Oct 2026; the CNAME file must stay).
url: "https://gettherecords.org"
baseurl: ""

# Search engines: sitemap.xml and search/social preview tags (both built in to GitHub Pages).
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

author: Public Records Enforcement Project
lang: en_US
social:
  name: Public Records Enforcement Project

collections:
  authors:
    output: false
  press:
    output: true
    permalink: /press/:name/

defaults:
  - scope:
      path: ""
      type: press
    values:
      layout: press

exclude:
  - README.md
  - CLAUDE.md
  - start.sh
  - docs
  - drafts
  - Gemfile
  - Gemfile.lock
  - vendor
