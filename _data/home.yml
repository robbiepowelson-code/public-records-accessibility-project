hero_label: California public records · Police use of force
hero_title: Public records should be public.
hero_highlight: We sue to get them out.
hero_text: Across California, government agencies too often disregard the California Public Records Act, delaying or withholding records the law makes public. When violations rarely lead to court, there is little pressure to comply. We bring cases to enforce the law and publish the records we obtain.

what_we_do:
  - label: Request
    text: We file California Public Records Act requests for shooting and use-of-force records, body camera video and 911 audio.
  - label: Sue
    text: When an agency misses its deadline or withholds records without a lawful reason, we file a petition in superior court in our own names.
  - label: Publish
    text: We post the filings and the records we obtain, with reporting and short videos explaining what they show.

who_we_are: The project is run by Yesica Prado and Robbie Powelson. Each case is filed by one of us as an individual requester, and we publish what we file.
