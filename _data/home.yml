hero_title: Public records should be public.
hero_highlight: We sue to get them out.
hero_text: Across California, government agencies too often disregard the California Public Records Act, delaying or withholding records the law makes public. When violations rarely lead to court, there is little pressure to comply. We bring cases to enforce the law and publish the records we obtain.

