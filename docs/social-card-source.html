<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PS;src:url(https://cdn.jsdelivr.net/npm/@fontsource/public-sans@5/files/public-sans-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:PS;src:url(https://cdn.jsdelivr.net/npm/@fontsource/public-sans@5/files/public-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:PM;src:url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/files/ibm-plex-mono-latin-500-normal.woff2);font-weight:500}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#0f1114}
.card{position:relative;width:1200px;height:630px;padding:76px 84px 0;color:#fff;font-family:PS,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;font:500 20px/1 PM,monospace;letter-spacing:.14em;text-transform:uppercase;color:#a9b0ba}
.mark{width:22px;height:22px;background:#f5c518}
h1{margin-top:58px;font-weight:800;font-size:92px;line-height:1.0;letter-spacing:-.025em;max-width:960px}
h1 span{color:#f5c518}
.line{margin-top:30px;font-weight:400;font-size:30px;line-height:1.35;color:#d7dbe0;max-width:900px}
.foot{position:absolute;left:0;right:0;bottom:0;height:96px;background:#f5c518;display:flex;align-items:center;justify-content:space-between;padding:0 84px;color:#111418}
.url{font:500 34px/1 PM,monospace;letter-spacing:.01em}
.tag{font:800 24px/1 PS,sans-serif;letter-spacing:.06em;text-transform:uppercase}
</style></head><body><div class="card">
<div class="top"><div class="mark"></div>California public records · Police use of force</div>
<h1>Public Records <span>Enforcement</span> Project</h1>
<p class="line">The records are public by law. We sue to get them out.</p>
<div class="foot"><div class="url">GetTheRecords.org</div><div class="tag">Request · Sue · Publish</div></div>
</div></body></html>
